<title>AI Agent 学习检测台 v3</title>
<style>
:root{--bg:#0d1117;--panel:#151b23;--panel2:#1b232d;--line:#2b3542;--fg:#e6edf3;--mut:#8b98a5;--acc:#4f8cff;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--purple:#a371f7}

.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.stat>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{font-size:20px;display:block}.stat span{color:var(--mut);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}.sub{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}
.hint{color:var(--mut);font-size:12px}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}
input,select,textarea{background:#0b1016;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:12px;min-width:0}textarea{width:100%;min-height:56px;resize:vertical}input:focus,select:focus,textarea:focus{outline:1px solid var(--acc);border-color:var(--acc)}
button.act{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px}button.act:disabled,button.ghost:disabled{opacity:.4;cursor:not-allowed}

.bar{height:7px;background:#0b1016;border-radius:7px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--acc)}.bar i.ok{background:var(--ok)}.bar i.bad{background:var(--bad)}
.task{border-top:1px solid var(--line);padding:12px 0}.task:first-child{border-top:0}.task .ttext{font-size:13px}.task .out{color:var(--purple);font-size:12px;margin:5px 0}.task-form{display:grid;grid-template-columns:140px 100px 1.05fr 1.05fr 100px;gap:7px;margin-top:8px;align-items:start}.task-form textarea{grid-column:1/-1}.task-form input[data-ev=hash]{grid-column:1/3}.ev-warn{margin-top:5px;font-size:12px;color:var(--warn)}.ev-ok{color:var(--ok)}
.q{border-top:1px solid var(--line);padding:14px 0}.q:first-child{border-top:0}.q .stem{font-weight:600;margin:5px 0 9px}.opt{display:block;padding:5px 0;color:var(--mut);cursor:pointer}.opt input{margin-right:8px;accent-color:var(--acc)}

.check{display:flex;gap:7px;align-items:flex-start;color:var(--mut);font-size:12px;margin:5px 0;cursor:pointer}.check input{margin-top:3px;accent-color:var(--acc)}
.gate{border-left:3px solid var(--line)}.gate.ok{border-left-color:var(--ok)}.gate.warn{border-left-color:var(--warn)}.gate.bad{border-left-color:var(--bad)}

@media(max-width:900px){.task-form{grid-template-columns:1fr 1fr}.task-form input[data-ev=hash]{grid-column:auto}main{padding:14px}nav{top:58px}}
</style>
<style>
/* UI standard v1.0: calm engineering workbench, shared by PC and H5. */

.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:42px;height:42px;flex:0 0 42px}.brand-copy{min-width:0}

.version{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:999px;background:var(--acc-soft);color:var(--acc-strong);font:600 11px/1 ui-monospace,"Cascadia Code",Consolas,monospace}
.topbar-meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.save-state{padding-left:10px;border-left:1px solid var(--line)}

nav button:hover{background:rgba(255,255,255,.72);color:var(--fg)}nav button.on{color:var(--acc-strong);background:#fff;border-color:#c8ded8;box-shadow:0 2px 6px rgba(23,34,31,.05)}

main{grid-column:2;grid-row:2;width:100%;max-width:1240px;padding:30px 32px 56px;margin:0 auto;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.stat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}.stat>div{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 16px;box-shadow:var(--shadow)}.stat b{font:700 24px/1.2 ui-monospace,"Cascadia Code",Consolas,monospace;display:block;color:var(--fg)}.stat span{display:block;margin-top:6px;color:var(--mut);font-size:12px;line-height:1.45}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.sub{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:14px;margin:12px 0}.card>.sub:last-child{margin-bottom:0}
.hint{color:var(--mut);font-size:12px;line-height:1.55}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}
label{color:var(--fg);font-size:13px;font-weight:600}label:has(> select),label:has(> input){display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;min-height:24px;font-size:11px;line-height:1.2;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}.pill.ok{color:#166534;background:#dcfce7;border-color:#bbf7d0;font-weight:700}.pill.bad{color:#991b1b;background:var(--bad-soft,#fee4e2);border-color:#fecaca}.pill.warn{color:#92400e;background:#fef3c7;border-color:#fde68a}.pill.info{color:#1d4ed8;background:#dbeafe;border-color:#bfdbfe}
.bar{height:7px;background:#dfe9e5;border-radius:999px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}.bar i.ok{background:var(--ok)}.bar i.bad{background:var(--bad)}
.task{border-top:1px solid var(--line);padding:20px 0 4px}.task:first-child{border-top:0;padding-top:16px}.task .ttext{font-size:14px;font-weight:600;line-height:1.65;margin:10px 0 4px}.task .out{color:var(--acc-strong);font-size:12px;margin:6px 0 12px;padding-left:10px;border-left:3px solid var(--acc-soft)}
.task-form{display:grid;grid-template-columns:minmax(125px,.7fr) minmax(135px,.8fr) minmax(180px,1.2fr) minmax(180px,1.2fr) minmax(90px,.55fr);gap:8px;margin-top:12px;align-items:start}.task-form textarea{grid-column:1/-1;min-height:72px}.task-form input[data-ev=hash]{grid-column:1/3}.ev-warn{margin-top:8px;font-size:12px;color:var(--warn);overflow-wrap:anywhere}.ev-ok{color:var(--ok)}
.q{border-top:1px solid var(--line);padding:22px 0 4px}.q:first-child{border-top:0;padding-top:12px}.q .stem{font-size:15px;font-weight:700;line-height:1.65;margin:12px 0 14px;max-width:82ch}.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;color:var(--fg);cursor:pointer;border:1px solid transparent;border-radius:4px;line-height:1.55}.opt:hover{background:var(--panel2);border-color:var(--line)}.opt input{width:18px;height:18px;flex:none;margin:1px 0 0;accent-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}th{color:var(--mut);font-weight:700;background:var(--panel2)}tbody tr:hover{background:#f7faf9}td{overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:#f5f8f7;border:1px solid var(--line);border-radius:4px;padding:16px;max-height:620px;overflow:auto;font:12px/1.65 ui-monospace,"Cascadia Code",Consolas,monospace;color:#29423b}.check{display:flex;gap:9px;align-items:flex-start;color:var(--fg);font-size:12px;line-height:1.5;margin:8px 0;cursor:pointer}.check input{width:17px;height:17px;flex:none;margin:1px 0 0;accent-color:var(--acc)}
.gate{border-left:3px solid var(--line)}.gate.ok{border-left-color:var(--ok)}.gate.warn{border-left-color:var(--warn)}.gate.bad{border-left-color:var(--bad)}.review{border-top:1px solid var(--line);padding:18px 0}.review:first-child{border-top:0;padding-top:4px}.review textarea{margin:12px 0}.due{color:var(--warn);font-weight:700}.overdue{color:var(--bad);font-weight:700}
#v-checkin>.card:first-child,#v-exam>.card:first-child,#v-review>.card:first-child,#v-mastery>.card:first-child,#v-report>.card:first-child{position:relative}#launchContext{color:var(--acc-strong);font-weight:600}#examHint{max-width:90ch}#examHistory table,#masteryBody table{min-width:700px}#examHistory>.card,#masteryBody>.card{overflow-x:auto}.task-form.sub{margin-top:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:1199px){.stat{grid-template-columns:repeat(3,minmax(0,1fr))}.task-form{grid-template-columns:repeat(3,minmax(0,1fr))}.task-form textarea{grid-column:1/-1}}
@media (max-width:959px){body{display:block;height:100dvh;overflow:hidden;padding-bottom:0}header{min-height:68px;padding:13px 18px}.topbar-meta{gap:6px}.brand-subtitle{display:none}nav{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);border-right:0;box-shadow:0 -5px 18px rgba(23,34,31,.08);overflow:visible}nav::before{display:none}nav button{min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:5px 2px;border-radius:4px;text-align:center;font-size:10px}nav button.on{box-shadow:none}nav button .nav-icon{width:19px;height:19px}main{height:calc(100dvh - 68px - 72px);overflow:auto;padding:22px 20px 36px;margin:0;max-width:none}.card{padding:16px;margin-bottom:12px}.stat{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}.stat>div{padding:12px}.stat b{font-size:20px}.task-form{grid-template-columns:1fr 1fr}.task-form input[data-ev=hash]{grid-column:auto}.between{gap:10px}.right{margin-left:auto}}
@media (max-width:599px){h1{font-size:18px}.brand img{width:36px;height:36px;flex-basis:36px}.brand{gap:9px}.topbar-meta{margin-left:auto}.save-state{display:none}header .mut{font-size:11px}main{padding:18px 16px 28px}.stat{grid-template-columns:repeat(2,minmax(0,1fr))}.stat>div:last-child{grid-column:1/-1}.task-form{grid-template-columns:1fr}.task-form textarea{grid-column:auto}.task{padding-top:18px}.task .ttext{font-size:13px}.q .stem{font-size:14px}.row{gap:7px}.row>label{width:100%}label:has(> select),label:has(> input){width:100%;justify-content:space-between}label:has(> select) select,label:has(> input) input{flex:1;width:auto}.topbar-meta #launchContext{display:none}.card>.between> .row{width:100%}.card>.between> .row button{flex:1}.task-form.sub{padding:0;margin-top:12px;background:transparent;border:0}.sub{padding:12px}.pill{font-size:10px}#examHistory table,#masteryBody table{font-size:11px}.review .row .right{width:auto;margin-left:auto}nav button{font-size:9px}}

<body>
<header class="topbar">
  <div class="brand">
    <img src="assets/brand-mark.svg" alt="AI Agent 学习检测台 Logo">
    <div class="brand-copy">
      <h1>AI Agent 学习检测台 <span class="version" id="bankVer">v3.1</span></h1>
      <p class="brand-subtitle">学习任务、证据、周测与能力门禁</p>
    </div>
  </div>
  <div class="topbar-meta">
    <span class="mut" id="launchContext"></span>
    <span class="mut save-state" id="savedTip">本地存储：尚未写入</span>
  </div>
</header>
<nav aria-label="学习检测台导航">
  <button data-tab="checkin" class="on" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18M8 14h3M8 18h6"></path></svg><span class="nav-label">每日打卡</span></button>
  <button data-tab="exam"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path><path d="M7 7h10M7 11h3M14 11h3M7 15h3M14 15h3M7 19h3"></path></svg><span class="nav-label">周测</span></button>
  <button data-tab="review"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6M12 7v5l3 2"></path></svg><span class="nav-label">复习队列</span></button>
  <button data-tab="mastery"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17"></path><path d="m7 15 4-4 3 2 5-6"></path><path d="M16 7h3v3"></path></svg><span class="nav-label">掌握度</span></button>
  <button data-tab="report"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path><path d="M14 3v5h5M8 12h8M8 16h8"></path></svg><span class="nav-label">报告</span></button>
</nav>
<main>
<section id="v-checkin">
  <div class="stat" id="overview"></div>
  <div class="card">
    <div class="between">
      <div><b>每日打卡证据门禁</b><div class="hint">DONE 必须绑定可复核证据；E6 不计通过，E4/E5 计入个人记录但不计入 V。实操与验收任务优先 E1-E3。</div></div>
      <label>查看周次：<select id="checkWeekSel"></select></label>
    </div>
  </div>
  <div id="checkinGrid"></div>
</section>
<section id="v-exam" hidden>
  <div class="card">
    <div class="row">
      <label>选择周次：<select id="weekSel"></select></label>
      <button class="act" id="startBtn">开始周测</button>
      <button class="ghost" id="retakeBtn" disabled>重新考试（保留历史）</button>
      <span id="examLock" class="hint right"></span>
    </div>
    <div class="row exam-evidence-row"><label class="hint" for="retakeEvidence">补强产物（补考必填）：<input id="retakeEvidence" placeholder="补强产物路径或说明（至少 8 字符）"></label></div>
<div class="hint exam-hint" id="examHint"></div>
  </div>
  <div id="examBody"></div>
  <div id="examHistory"></div>
</section>
<section id="v-review" hidden>
  <div class="card"><div class="between"><div><b>1/3/7/21 天复习队列</b><div class="hint">答错重置为 1 天；答对推进 3→7→21 天；21 天连续两次正确标记 stable；犹豫则维持当前间隔。</div></div><button class="ghost" id="refreshReviewBtn">刷新到期状态</button></div></div>
  <div id="reviewBody"></div>
</section>
<section id="v-mastery" hidden>
  <div class="card"><div class="between"><div><b>掌握度与 M1-M4 门禁</b><div class="hint">M_base = 0.25q + 0.35p + 0.25r + 0.15s；门门 G=0 时 M_final ≤ 0.59。衰减通过复习到期状态标记，不修改 08 的公式。</div></div><button class="ghost" id="refreshMasteryBtn">重新计算</button></div></div>
  <div id="masteryBody"></div>
</section>
<section id="v-report" hidden>

function gateCard(m){var d=(BANK.gates||{})[m]||{},g=gateStatus(m),eg=(state.gateEvidence||{})[m]||[],sg=(state.gateSafety||{})[m]||[],rl=state.redlines&&state.redlines[m]||{};var missing=g.missing.length?"未达标："+g.missing.map(function(x){return x.skill_id+" "+pct(x.score)+"<"+pct(x.threshold)+(x.typeCoverage<1?"（题型覆盖 "+pct(x.typeCoverage)+"）":"");}).join("、"):"全部 skill_id 达到阈值且题型覆盖完整";var ev=(d.evidence||[]).map(function(x,i){return "<label class=\"check\"><input type=\"checkbox\" data-gate-evidence=\""+m+"\" data-idx=\""+i+"\""+(eg[i]?" checked":"")+">"+esc(x)+"</label>";}).join("");var sf=(d.safety||[]).map(function(x,i){return "<label class=\"check\"><input type=\"checkbox\" data-gate-safety=\""+m+"\" data-idx=\""+i+"\""+(sg[i]?" checked":"")+">"+esc(x)+"</label>";}).join("");var lines=REDLINES.map(function(x){return "<label class=\"check\"><input type=\"checkbox\" data-redline=\""+m+"\" data-rid=\""+x.id+"\""+(rl[x.id]?" checked":"")+">"+esc(x.label)+"</label>";}).join("");return "<div class=\"card gate "+(g.passed?"ok":(g.skillPass&&g.redlinePass?"warn":"bad"))+"\" data-gate=\""+m+"\"><div class=\"between\"><b>"+esc(d.title||m)+"</b><span class=\"pill "+(g.passed?"ok":"bad")+"\">"+(g.passed?"通过":"不通过")+"</span></div><div class=\"hint\">"+missing+"</div><div class=\"sub\"><b>工程证据</b>"+ev+"</div><div class=\"sub\"><b>安全/放行</b>"+sf+"</div><div class=\"sub\"><b>安全红线</b>"+lines+"</div><div class=\"row\"><button class=\"ghost\" data-gate-snapshot=\""+m+"\">锁定门禁快照</button><span class=\"hint\">打卡 "+(g.checkinPass?"√":"×")+"｜工程证据 "+(g.evidencePass?"√":"×")+"｜安全 "+(g.safetyPass?"√":"×")+"｜INF-00 "+(g.infPass?"√":"×")+"｜红线 "+(g.redlinePass?"√":"×")+"｜复习/安全专项 "+(g.reviewPass?"√":"×")+"｜题型覆盖 "+(g.typeCoveragePass?"√":"×")+"｜前序门禁 "+(g.priorPass?"√":"×")+"</span></div></div>";}
function renderMastery(){var snap={};Object.keys(BANK.skills||{}).forEach(function(s){snap[s]=masteryForSkill(s);});var rows=Object.keys(snap).map(function(s){var x=snap[s];return "<tr><td><b>"+esc(s)+"</b><div class=\"hint\">"+esc(x.name)+"</div></td><td><span class=\"pill "+masteryClass(x.score)+"\">"+pct(x.score)+"</span></td><td>"+pctOr(x.q)+" / "+pctOr(x.p)+" / "+pctOr(x.r)+" / "+pctOr(x.s)+"</td><td>"+pct(x.typeCoverage)+"</td><td>"+(x.gate?"开放":"被门禁封顶")+"</td><td>"+(x.decayed?"<span class=\"pill bad\">衰减/逾期</span>":(x.downgraded?"<span class=\"pill bad\">连续同因降级</span>":"正常"))+"</td><td>"+x.attempts+" 题次 · 覆盖 "+pct(x.coverage)+"</td></tr>";}).join("");var gates=Object.keys(BANK.gates||{}).map(gateCard).join("");var inf='<div class="card"><b>INF-00 横切门禁</b>'+["e4e5NotProd","noE6","traceable"].map(function(k){var text={e4e5NotProd:"E4/E5 推断没有直接驱动生产写操作",noE6:"E6 猜测未进入接口契约或生产配置",traceable:"所有“已确认”结论能指向可复核依据"}[k];return '<label class="check"><input type="checkbox" data-inf00="'+k+'"'+(state.inf00&&state.inf00[k]?" checked":"")+">"+text+"</label>";}).join("")+"</div>";el("masteryBody").innerHTML='<div class="card"><b>18 个主 skill_id 掌握度</b><div class="hint">q=客观题正确率，p=代码题通过率，r=场景 rubric，s=复习加权正确率（仅计正式来源且排除犹豫）；题型覆盖必须 100% 才允许门禁通过。M_prev 取不可变基线，首次考试直接用 M_base。</div><table><thead><tr><th>Skill</th><th>M_final</th><th>q / p / r / s</th><th>题型覆盖</th><th>门禁</th><th>状态</th><th>样本</th></tr></thead><tbody>'+rows+"</tbody></table></div>"+inf+gates;}
function evidenceLine(e){if(!e)return "无证据";return "["+(e.level||"-")+"] path="+(e.pathOrUrl||"-")+"; command="+(e.command||"-")+"; exit="+(e.exitCode||"-")+"; summary="+(e.summary||"-")+"; hash="+(e.hash||"-");}
function reportData(){var days={};WEEKS.forEach(function(w){days["W"+w.week]={title:w.title,days:(w.days||[]).map(function(d){return {day:d.day,tasks:(d.tasks||[]).map(function(t){var s=stateForTask(t.id);return {id:t.id,text:t.text,status:s.status,evidence:s.evidence,validDone:validDone(s),gateEvidence:gateEvidence(s.evidence)};})};})};});var gates={};Object.keys(BANK.gates||{}).forEach(function(m){gates[m]=gateStatus(m);});return {bankVersion:BANK.bankVersion||BANK.version,exportedAt:new Date().toISOString(),formalPaper:BANK.formalPaper,days:days,examHistory:state.examHistory,reviewItems:state.reviewItems,reviewHistory:state.reviewHistory,mastery:state.mastery,masteryBaseline:state.masteryBaseline,masteryDowngraded:state.masteryDowngraded,masteryHistory:state.masteryHistory,gates:gates,gateHistory:state.gateHistory,redlines:state.redlines,inf00:state.inf00};}
function buildReportMd(){var d=reportData(),out=[];out.push("# AI Agent 学习证据与门禁报告");out.push("");out.push("- 题库版本："+d.bankVersion);out.push("- 导出时间："+d.exportedAt);out.push("- 当前试卷：16 周 × 3～5 题小测（共 "+QUESTIONS.length+" 题）；正式卷 "+d.formalPaper.questionCount+" 题，状态 "+d.formalPaper.status);out.push("");out.push("## 每日任务证据");Object.keys(d.days).forEach(function(wk){var w=d.days[wk];out.push("");out.push("### "+wk+"｜"+w.title);w.days.forEach(function(day){out.push("");out.push("#### Day "+day.day);day.tasks.forEach(function(t){out.push("- ["+(t.validDone?"x":" ")+"] "+t.id+"｜"+t.status+"｜门禁证据="+t.gateEvidence+"｜"+evidenceLine(t.evidence));});});});out.push("");out.push("## 周测与重考历史");Object.keys(d.examHistory||{}).sort(function(a,b){return Number(a)-Number(b);}).forEach(function(w){(d.examHistory[w]||[]).forEach(function(a,i){out.push("");out.push("### W"+w+" 第 "+(i+1)+" 次｜"+a.score+" 分｜"+(a.passed?"通过":"未通过"));out.push("- attempt_id："+a.attemptId+"；题库版本："+a.bankVersion+"；计入 mastery："+a.countsForMastery);(a.results||[]).forEach(function(r){var extra="";if(r.selected&&r.selected.length)extra+="｜选项="+r.selected.join(",");if(r.type==="code"||r.type==="scenario"){extra+="｜rubric命中="+(Number(r.rubricHits)||0);extra+="｜开放作答="+(clean(r.openAnswer)?clean(r.openAnswer).replace(/\n/g," ").slice(0,120):"-");}out.push("  - "+r.question_id+"｜"+r.skill_id+"｜"+r.type+"｜"+r.score+"/"+r.maxScore+"｜"+(r.passed?"通过":"未通过")+"｜"+r.note+"｜证据："+evidenceLine(r.evidence)+extra);});});});out.push("");out.push("## 复习与衰减状态");Object.keys(d.reviewItems||{}).forEach(function(k){var it=d.reviewItems[k];out.push("- "+k+"｜"+it.skill_id+"｜间隔 "+it.intervalDays+" 天｜连续正确 "+it.streak+"｜状态 "+it.status+"｜到期 "+it.dueAt+"｜"+(it.safety&&!it.safetyClosed?"安全专项未关闭":"安全专项正常"));});out.push("");out.push("## 掌握度");Object.keys(d.mastery||{}).forEach(function(s){var x=d.mastery[s];out.push("- "+s+"｜"+pct(x.score)+"｜q="+pctOr(x.q)+" p="+pctOr(x.p)+" r="+pctOr(x.r)+" s="+pctOr(x.s)+"｜覆盖="+pct(x.coverage)+"｜题次="+x.attempts+"｜门禁="+x.gate+"｜衰减="+x.decayed);});out.push("");out.push("## 掌握度变更历史");var mh=d.masteryHistory||[];if(!mh.length)out.push("- 暂无（点击“刷新掌握度”会写入快照）");mh.slice(-20).forEach(function(h){out.push("- "+h.at+"｜变更 "+((h.changed||[]).join("、")||"-"));});out.push("");out.push("## 门禁快照历史");var gh=d.gateHistory||[];if(!gh.length)out.push("- 暂无（点击门禁卡片“记录快照”会写入）");gh.slice(-20).forEach(function(g){out.push("- "+g.at+"｜"+g.milestone+"｜"+(g.status&&g.status.passed?"通过":"不通过")+"｜工程证据="+((g.gateEvidence||[]).filter(Boolean).length)+" 项｜安全="+((g.gateSafety||[]).filter(Boolean).length)+" 项｜红线="+(Object.keys(g.redlines||{}).filter(function(k){return g.redlines[k];}).join("、")||"无"));});out.push("");out.push("## M1-M4 门禁");Object.keys(d.gates||{}).forEach(function(m){var g=d.gates[m];out.push("- "+m+"｜"+(g.passed?"通过":"不通过")+"｜skill="+g.skillPass+"｜工程证据="+g.evidencePass+"｜安全="+g.safetyPass+"｜INF-00="+g.infPass+"｜红线="+g.redlinePass+"｜安全专项="+g.reviewPass);if(g.missing.length)out.push("  - 未达标："+g.missing.map(function(x){return x.skill_id+" "+pct(x.score)+"/"+pct(x.threshold);}).join("、"));});out.push("");out.push("## 审计边界（结论解读前必读）");out.push("- 本系统为本地 localStorage 单机版，不含服务端校验，换浏览器或清缓存后数据不可恢复。");out.push("- 证据为人工登记，系统只能校验“字段是否填写”，无法证明任务真实完成。");out.push("- 当前为 16 周 × 3～5 题小测（共 "+QUESTIONS.length+" 题）；正式 "+d.formalPaper.questionCount+" 题卷状态为 "+d.formalPaper.status+"。");out.push("- M1-M4 的工程证据与安全专项依赖人工勾选，需以代码评审/回滚演练记录复核。");out.push("");out.push("## INF-00 与安全红线");out.push("- INF-00："+JSON.stringify(d.inf00));Object.keys(d.redlines||{}).forEach(function(m){var active=Object.keys(d.redlines[m]||{}).filter(function(k){return d.redlines[m][k];});if(active.length)out.push("- "+m+" 红线："+active.join("、"));});return out.join("\n");}
function renderReport(){el("reportBody").textContent=buildReportMd();}
function syncExamInputs(){if(!currentExam)return;Object.keys(currentExam.answers||{}).forEach(function(k){delete currentExam.answers[k];});QUESTIONS.filter(function(q){return q.week===currentExam.week;}).forEach(function(q){var a=[];document.querySelectorAll('[data-qid="'+q.id+'"] [data-answer]:checked').forEach(function(n){a.push(Number(n.value));});currentExam.answers[q.id]=a;var op=document.querySelector('[data-open-answer="'+q.id+'"]');if(op)currentExam.open[q.id]=op.value;var rb=[];document.querySelectorAll('[data-rubric="'+q.id+'"]:checked').forEach(function(n){rb.push(Number(n.value));});currentExam.rubric[q.id]=rb;currentExam.evidence[q.id]=selectedEvidence(q.id);});saveState();}
function bindExamEvents(){var sel=el("weekSel");sel.innerHTML=WEEKS.map(function(w){return "<option value=\""+w.week+"\">W"+w.week+" · "+esc(w.title)+"</option>";}).join("");el("startBtn").onclick=function(){startExam(false);};el("retakeBtn").onclick=function(){startExam(true);};sel.onchange=function(){renderExam();};el("examBody").addEventListener("change",function(e){if(!currentExam)return;syncExamInputs();});el("examBody").addEventListener("input",function(e){if(!currentExam)return;var box=e.target.closest("[data-qid]"),qid=box&&box.getAttribute("data-qid");if(qid&&e.target.hasAttribute("data-open-answer"))currentExam.open[qid]=e.target.value;if(qid&&e.target.hasAttribute("data-field")){if(!currentExam.evidence[qid])currentExam.evidence[qid]={};currentExam.evidence[qid][e.target.dataset.field]=e.target.value;}saveState();});el("examBody").addEventListener("click",function(e){if(e.target.id==="submitExam")submitExam();});}
function bindReviewEvents(){el("refreshReviewBtn").onclick=function(){renderReview();renderOverview();};el("reviewBody").addEventListener("click",function(e){var b=e.target.closest("[data-review-action]");if(!b)return;var qid=b.getAttribute("data-qid"),note=document.querySelector('[data-review-note="'+qid+'"]');recordReview(qid,b.getAttribute("data-review-action"),note?note.value:"");});}
function bindMasteryEvents(){el("refreshMasteryBtn").onclick=function(){refreshMastery();renderMastery();renderReport();};el("masteryBody").addEventListener("change",function(e){var t=e.target,m;if(t.hasAttribute("data-inf00")){state.inf00=state.inf00||{};state.inf00[t.getAttribute("data-inf00")]=t.checked;}else if(t.hasAttribute("data-gate-evidence")){m=t.getAttribute("data-gate-evidence");state.gateEvidence=state.gateEvidence||{};state.gateEvidence[m]=state.gateEvidence[m]||[];state.gateEvidence[m][Number(t.dataset.idx)]=t.checked;}else if(t.hasAttribute("data-gate-safety")){m=t.getAttribute("data-gate-safety");state.gateSafety=state.gateSafety||{};state.gateSafety[m]=state.gateSafety[m]||[];state.gateSafety[m][Number(t.dataset.idx)]=t.checked;}else if(t.hasAttribute("data-redline")){m=t.getAttribute("data-redline");state.redlines=state.redlines||{};state.redlines[m]=state.redlines[m]||{};state.redlines[m][t.getAttribute("data-rid")]=t.checked;}else{return;}refreshMastery();renderMastery();renderReport();saveState();});el("masteryBody").addEventListener("click",function(e){var b=e.target.closest("[data-gate-snapshot]");if(b)recordGateSnapshot(b.getAttribute("data-gate-snapshot"));});}
function switchTab(name){currentTab=name;document.querySelectorAll("nav button").forEach(function(b){var active=b.getAttribute("data-tab")===name;b.classList.toggle("on",active);if(active)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});["checkin","exam","review","mastery","report"].forEach(function(x){el("v-"+x).hidden=x!==name;});}
function bindAll(){document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){switchTab(b.getAttribute("data-tab"));};});bindCheckinEvents();bindExamEvents();bindReviewEvents();bindMasteryEvents();el("checkWeekSel").onchange=function(){checkWeek=Number(this.value);renderCheckin();};el("copyMd").onclick=function(){var text=buildReportMd();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){alert("Markdown 已复制");});else{var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();alert("Markdown 已复制");}};el("downloadMd").onclick=function(){download("exam-report-"+Date.now()+".md",buildReportMd(),"text/markdown");};el("downloadJson").onclick=function(){download("exam-report-"+Date.now()+".json",JSON.stringify(reportData(),null,2),"application/json");};el("resetBtn").onclick=function(){if(confirm("确认清空本地 v3 打卡、考试、复习和门禁数据？此操作不可撤销。")){localStorage.removeItem(KEY);state=defaultState();renderAll();}};}
function download(name,text,type){var a=document.createElement("a"),blob=new Blob([text],{type:type+";charset=utf-8"});a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},0);}
function renderAll(){el("bankVer").textContent="v"+(BANK.bankVersion||BANK.version||"3.0");renderCheckWeekSel();if(currentExam&&currentExam.week)el("weekSel").value=String(currentExam.week);renderOverview();renderCheckin();renderExam();renderReview();refreshMastery(false);renderMastery();renderReport();}
function applyLaunchContext(){
  if(launchWeek>=1&&launchWeek<=16){
    checkWeek=launchWeek;
    var checkSel=el("checkWeekSel");
    if(checkSel)checkSel.value=String(launchWeek);
    var examSel=el("weekSel");
    if(examSel)examSel.value=String(launchWeek);
    renderCheckin();
    renderExam();
  }
  var context=el("launchContext");
  if(context&&(launchDate||launchWeek))context.textContent="消息入口"+(launchDate?" · "+launchDate:"")+(launchWeek?" · W"+launchWeek:"");
  if(["checkin","exam","review","mastery","report"].indexOf(launchTab)>=0)switchTab(launchTab);
}
var formFieldSeed=0;
function ensureFormNames(){document.querySelectorAll("input,select,textarea").forEach(function(node){if(!node.id&&!node.name){formFieldSeed+=1;node.name=(node.dataset.field||node.type||node.tagName.toLowerCase())+"-"+formFieldSeed;}});}
function watchFormFields(){ensureFormNames();var observer=new MutationObserver(function(){ensureFormNames();});observer.observe(document.body,{childList:true,subtree:true});}
function init(){bindAll();renderAll();applyLaunchContext();watchFormFields();}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
