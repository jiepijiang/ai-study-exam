services:
  - type: web
    name: ai-study-exam
    runtime: node
    plan: free
    rootDir: fullstack
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
